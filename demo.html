<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeenCare Demo</title>
<link rel="icon" href="img/logo.png">
<style>
:root{--bg:#f4faff;--card:#fff;--ink:#12303d;--mut:#4d6773;--pri:#0f6fb8;--acc:#12a37f;--line:#d9e7ef;--soft:#e6f3fb;--warn:#e8890c}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a21;--card:#14262f;--ink:#e6f1f6;--mut:#9db5c0;--pri:#5db4f0;--acc:#3fd0a8;--line:#24404d;--soft:#173340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.top img{width:34px;height:34px;border-radius:50%}
.top b{flex:1}
.top a{color:var(--pri);text-decoration:none;font-size:.9em}
button{font:inherit;cursor:pointer}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px}
.note{max-width:760px;margin:14px auto 0;padding:0 16px;color:var(--mut);font-size:.92em;text-align:center}
.stage{display:flex;justify-content:center;padding:16px}
.phone{width:min(390px,100%);height:min(760px,calc(100vh - 150px));min-height:560px;border:8px solid #1c2a33;border-radius:36px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.bar{padding:14px 16px 8px;background:var(--pri);color:#fff}
.bar small{opacity:.85}
.bar h1{margin:0;font-size:1.15rem}
.banner{background:var(--warn);color:#fff;padding:9px 14px;font-weight:700;font-size:.92em;animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
.body{flex:1;overflow:auto;padding:14px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;color:var(--mut);font-size:.82em}
.tabs button.on{color:var(--pri);font-weight:700;border-top:3px solid var(--pri);margin-top:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row .g{flex:1}
.mut{color:var(--mut);font-size:.88em}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--pri);background:none;color:#fff;font-size:1.1em}
.chk.done{background:var(--acc);border-color:var(--acc)}
.pb{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;background:var(--acc);transition:width .3s}
.pb i.over{background:var(--warn)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:700}
.btn.alt{background:var(--soft);color:var(--pri)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82em;background:var(--soft);color:var(--pri)}
.pill.low{background:#fde8cf;color:#9a5300}
.dis{font-size:.8em;color:var(--mut);margin-top:10px}
svg{width:100%;height:auto}
</style>
</head>
<body>
<div class="top"><img src="img/logo.png" alt=""><b>LeenCare Demo</b><a href="index.html" id="back"></a><button class="lang" id="lang" type="button"></button></div>
<p class="note" id="note"></p>
<div class="stage"><div class="phone">
  <div class="bar"><small id="hello"></small><h1 id="title"></h1></div>
  <div id="banner"></div>
  <div class="body" id="body"></div>
  <div class="tabs" id="tabs"></div>
</div></div>
<script>
(function(){
var L='ar';try{L=localStorage.getItem('lc_lang')||'ar'}catch(e){}
var S={ar:{back:'الموقع',lang:'English',note:'عرض تجريبي ببيانات وهمية بالكامل. لا يُحفظ شيء ولا يمثل أي شخص حقيقي. جرّب تأكيد جرعة أو إضافة سوائل.',hello:'مرحباً',who:'مريض تجريبي',today:'اليوم',meds:'الأدوية',fluids:'السوائل',labs:'التحاليل',
 doses:'جرعات اليوم',left:'متبقي',of:'من',stock:'المخزون',days:'يوم',box:'علبة',pills:'حبة',add:'إضافة',addBox:'إضافة علبة',low:'ينتهي خلال أسبوع:',cream:'كريم: كل علبة تكفي 30 يوماً على الأقل',
 intake:'السوائل الداخلة',limit:'الحد اليومي',ml:'مل',other:'إسهال/قيء (تقدير)',addMl:'إضافة 100 مل',addLoss:'إضافة 100 مل',overlimit:'تجاوزت الحد الذي حدده فريقك الطبي',
 cr:'الكرياتينين (mg/dL)',crnote:'قيم وهمية للتوضيح فقط. التطبيق يعرض القيم ولا يشخّص ولا يقرر أن نتيجة حرجة.',dis:'التطبيق أداة تنظيم ومتابعة ولا يغني عن الطبيب.',
 m:['أدوية الضغط','فيتامين د','كريم الجلد'],tm:['8:00 ص','8:00 م']},
en:{back:'Website',lang:'العربية',note:'A demo with entirely fake data. Nothing is saved and it represents no real person. Try confirming a dose or adding fluids.',hello:'Hello',who:'Demo patient',today:'Today',meds:'Medicines',fluids:'Fluids',labs:'Labs',
 doses:"Today's doses",left:'left',of:'of',stock:'Stock',days:'days',box:'box',pills:'pills',add:'Add',addBox:'Add a box',low:'Runs out within a week:',cream:'Cream: each box counts as at least 30 days',
 intake:'Fluid intake',limit:'Daily limit',ml:'mL',other:'Diarrhea/vomiting (estimate)',addMl:'Add 100 mL',addLoss:'Add 100 mL',overlimit:'Above the limit set by your care team',
 cr:'Creatinine (mg/dL)',crnote:'Fake values for illustration only. The app shows values; it never diagnoses or decides a result is critical.',dis:'The app is an organising and follow-up tool and is not a substitute for a doctor.',
 m:['Blood pressure tablet','Vitamin D','Skin cream'],tm:['8:00 AM','8:00 PM']}};
function t(k){return S[L][k]}
var tab='today';
var meds=[{id:0,pills:20,perDay:2,cream:false},{id:1,pills:6,perDay:1,cream:false},{id:2,pills:2,perDay:1,cream:true}];
var doses=[{m:0,s:0,d:false},{m:1,s:0,d:false},{m:2,s:1,d:false},{m:0,s:1,d:false}];
var fl={intake:900,loss:0,limit:1500};
var cr=[1.8,1.7,1.9,1.6,1.7,1.5,1.6];
function days(m){if(m.cream)return Math.min(90,Math.floor(m.pills*30));return m.perDay?Math.floor(m.pills/m.perDay):0}
function render(){
  var h=document.documentElement;h.lang=L;h.dir=L==='ar'?'rtl':'ltr';
  document.getElementById('back').textContent=t('back');document.getElementById('lang').textContent=t('lang');
  document.getElementById('note').textContent=t('note');document.getElementById('hello').textContent=t('hello');document.getElementById('title').textContent=t('who');
  var lows=meds.filter(function(m){return days(m)<=7});
  document.getElementById('banner').innerHTML=lows.length?'<div class="banner">⚠ '+t('low')+' '+lows.map(function(m){return S[L].m[m.id]}).join('، ')+'</div>':'';
  var tabs=[['today',t('today')],['meds',t('meds')],['fluids',t('fluids')],['labs',t('labs')]];
  document.getElementById('tabs').innerHTML=tabs.map(function(x){return '<button data-t="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
  var b=document.getElementById('body'),h2='';
  if(tab==='today'){
    var n=doses.filter(function(d){return d.d}).length;
    h2+='<div class="card"><b>'+t('doses')+'</b><div class="pb"><i style="width:'+(n/doses.length*100)+'%"></i></div><span class="mut">'+n+' '+t('of')+' '+doses.length+'</span></div>';
    doses.forEach(function(d,i){h2+='<div class="card row"><button class="chk'+(d.d?' done':'')+'" data-d="'+i+'" aria-label="confirm">'+(d.d?'✓':'')+'</button><div class="g"><b>'+S[L].m[d.m]+'</b><div class="mut">'+S[L].tm[d.s]+'</div></div></div>'});
  }
  if(tab==='meds'){
    h2+='<div class="card mut">'+t('cream')+'</div>';
    meds.forEach(function(m){var dd=days(m);h2+='<div class="card"><div class="row"><div class="g"><b>'+S[L].m[m.id]+'</b><div class="mut">'+t('stock')+': '+(m.cream?m.pills+' '+t('box'):m.pills+' '+t('pills'))+'</div></div><span class="pill'+(dd<=7?' low':'')+'">'+dd+' '+t('days')+'</span></div><p style="margin:8px 0 0"><button class="btn alt" data-a="'+m.id+'">'+t('addBox')+'</button></p></div>'});
  }
  if(tab==='fluids'){
    var tot=fl.intake,pc=Math.min(100,tot/fl.limit*100);
    h2+='<div class="card"><b>'+t('intake')+'</b><div class="pb"><i class="'+(tot>fl.limit?'over':'')+'" style="width:'+pc+'%"></i></div><span class="mut">'+tot+' / '+fl.limit+' '+t('ml')+'</span>'+(tot>fl.limit?'<p style="color:var(--warn);font-weight:700;margin:6px 0 0">'+t('overlimit')+'</p>':'')+'<p style="margin:8px 0 0"><button class="btn" data-f="in">'+t('addMl')+'</button></p></div>';
    h2+='<div class="card"><b>'+t('other')+'</b><div class="mut">'+fl.loss+' '+t('ml')+'</div><p style="margin:8px 0 0"><button class="btn alt" data-f="loss">'+t('addLoss')+'</button></p></div>';
  }
  if(tab==='labs'){
    var w=300,ht=150,mx=2.2,mn=1.2,pts=cr.map(function(v,i){return [20+i*(w-40)/(cr.length-1),ht-20-(v-mn)/(mx-mn)*(ht-40),v]});
    h2+='<div class="card"><b>'+t('cr')+'</b><svg viewBox="0 0 '+w+' '+ht+'" role="img" aria-label="creatinine"><polyline fill="none" stroke="var(--pri)" stroke-width="3" points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>'+pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--pri)"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+p[2]+'</text>'}).join('')+'</svg><div class="mut">'+t('crnote')+'</div></div>';
  }
  h2+='<div class="dis">'+t('dis')+'</div>';
  b.innerHTML=h2;
}
document.addEventListener('click',function(e){
  var x=e.target.closest('button');if(!x)return;
  if(x.id==='lang'){L=L==='ar'?'en':'ar';try{localStorage.setItem('lc_lang',L)}catch(_){}}
  else if(x.dataset.t){tab=x.dataset.t}
  else if(x.dataset.d!==undefined){var d=doses[+x.dataset.d],m=meds[d.m];d.d=!d.d;if(!m.cream){m.pills+=d.d?-1:1;if(m.pills<0)m.pills=0}}
  else if(x.dataset.a!==undefined){var m2=meds[+x.dataset.a];m2.pills+=m2.cream?1:30}
  else if(x.dataset.f==='in'){fl.intake+=100}
  else if(x.dataset.f==='loss'){fl.loss+=100}
  else return;
  render();
});
render();
})();
</script>
</body></html>
